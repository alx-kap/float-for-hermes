name: Float
options:
  bundleIdPrefix: com.alexk
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Float:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Float
        CFBundleName: Float
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Float listens so you can talk to your Hermes agent.
        NSSpeechRecognitionUsageDescription: Float transcribes your voice on-device to send to Hermes.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexk.float
        PRODUCT_NAME: Float
        PRODUCT_MODULE_NAME: FloatApp
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
